apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ng-core

bases:
  - ../base

namePrefix: prod-

replicas:
  - name: ng-core
    count: 3

images:
  - name: ng-core
    newName: ng-core
    newTag: latest

patchesStrategicMerge:
  - deployment-patch.yaml

configMapGenerator:
  - name: ng-core-config
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=warn
      - API_BASE_URL=https://ng-core.example.com

resources:
  - ingress.yaml
  - hpa.yaml
  - network-policy.yaml

commonLabels:
  environment: production
  tier: frontend
