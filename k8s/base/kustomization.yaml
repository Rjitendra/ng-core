apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ng-core

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml

commonLabels:
  app: ng-core
  managed-by: kustomize

commonAnnotations:
  deployment.kubernetes.io/revision: '1'
